name: Deploy current branch previews

on:
  push:
    branches:
      - main
      - feat/docs-by-member
      - feat/family-member-management
      - codex/fix-pages-preview
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: sources/main
      - name: Check out docs by member branch
        uses: actions/checkout@v4
        with:
          ref: feat/docs-by-member
          path: sources/docs-by-member
      - name: Check out family member branch
        uses: actions/checkout@v4
        with:
          ref: feat/family-member-management
          path: sources/family-member-management
      - name: Assemble previews
        shell: bash
        run: |
          mkdir -p _site/main _site/docs-by-member _site/family-member-management
          rsync -a --exclude='.git' sources/main/ _site/main/
          rsync -a --exclude='.git' sources/docs-by-member/ _site/docs-by-member/
          rsync -a --exclude='.git' sources/family-member-management/ _site/family-member-management/
          sed -E -i "s/const STORAGE_KEY = '[^']*';/const STORAGE_KEY = 'kangban-preview-main-v1';/" _site/main/app.js
          sed -E -i "s/const STORAGE_KEY = '[^']*';/const STORAGE_KEY = 'kangban-preview-docs-by-member-v1';/" _site/docs-by-member/app.js
          sed -E -i "s/const STORAGE_KEY = '[^']*';/const STORAGE_KEY = 'kangban-preview-family-member-v1';/" _site/family-member-management/app.js
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="theme-color" content="#f7f6f1">
            <title>康伴 · 三分支预览</title>
            <style>
              :root{color-scheme:light;--green:#4f7058;--ink:#26352b;--paper:#f7f6f1;--line:#e6e5dc}
              *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
              main{width:min(760px,calc(100% - 32px));margin:72px auto;padding:36px 28px;background:#fff;border:1px solid var(--line);border-radius:24px}
              .eyebrow{color:var(--green);font-size:14px;font-weight:700;letter-spacing:.08em}h1{margin:10px 0;font-size:32px}p{line-height:1.7;color:#657168}
              ul{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:12px}a{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border:1px solid var(--line);border-radius:16px;color:var(--ink);text-decoration:none;font-weight:700}
              a:hover,a:focus-visible{border-color:var(--green);outline:none}small{display:block;margin-top:5px;color:#7a847d;font-weight:400}
              @media(max-width:520px){main{margin:24px auto;padding:28px 18px}h1{font-size:27px}}
            </style>
          </head>
          <body><main>
            <div class="eyebrow">KANGBAN · PREVIEW</div>
            <h1>康伴分支预览</h1>
            <p>选择一个版本查看。分支更新后，预览会自动刷新。</p>
            <ul>
              <li><a href="main/"><span>主线版本<small>main</small></span><span>打开 →</span></a></li>
              <li><a href="docs-by-member/"><span>资料与分享改进<small>feat/docs-by-member</small></span><span>打开 →</span></a></li>
              <li><a href="family-member-management/"><span>我的改动<small>feat/family-member-management</small></span><span>打开 →</span></a></li>
            </ul>
          </main>
          <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).catch(()=>{});</script>
          </body></html>
          HTML
          cat > _site/service-worker.js <<'WORKER'
          self.addEventListener('install', event => event.waitUntil(self.skipWaiting()));
          self.addEventListener('activate', event => {
            event.waitUntil((async () => {
              const keys = await caches.keys();
              await Promise.all(keys.map(key => caches.delete(key)));
              await self.registration.unregister();
              await self.clients.claim();
            })());
          });
          WORKER
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
