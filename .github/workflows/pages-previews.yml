name: Deploy current main preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: sources/main

      - name: Assemble current main preview
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.env' --exclude='.env.*' sources/main/ _site/
          sed -E -i "s/const STORAGE_KEY = '[^']*';/const STORAGE_KEY = 'kangban-preview-main-v2';/" _site/app.js
          cat > _site/service-worker.js <<'WORKER'
          self.addEventListener('install', event => event.waitUntil(self.skipWaiting()));
          self.addEventListener('activate', event => {
            event.waitUntil((async () => {
              const keys = await caches.keys();
              await Promise.all(keys.map(key => caches.delete(key)));
              await self.registration.unregister();
              await self.clients.claim();
            })());
          });
          WORKER
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
